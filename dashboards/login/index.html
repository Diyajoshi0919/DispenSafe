<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login | Campus Dispensary</title>
  <link rel="icon" href="/static/shared/img/nitj-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/shared/style.css">
  <link rel="stylesheet" href="/static/login/login.css">
</head>
<body>
  <header class="appbar">
    <div class="wrap">
      <a class="appbar-brand" href="/">
        <img src="/static/shared/img/nitj-logo.png" alt="" width="46" height="49">
        <span><span class="appbar-title">Campus Dispensary</span><br><span class="appbar-sub">Staff login</span></span>
      </a>
      <a class="btn btn-appbar" href="/">Back to home</a>
    </div>
  </header>

  <main class="login-main">
    <form class="card login-card" id="login-form" novalidate>
      <h1 id="login-title">Staff login</h1>
      <p class="lead">For OPD and pharmacy staff.</p>

      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <label class="show-pw"><input type="checkbox" id="show-pw"> Show password</label>

      <button class="btn btn-primary" type="submit" id="submit">Log in</button>
      <p class="form-error" id="error" role="alert"></p>

      <p class="login-help">Forgot your password? Ask the dispensary admin to reset it.</p>
    </form>
  </main>

  <script src="/static/login/login.js"></script>
</body>
</html>
